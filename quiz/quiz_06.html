        //후위식으로 변환하는거 수행평가로 냄.

        function solution(s){
            let answer = 0;
            let stack = [];
            for(let x of s){
              //  console.log(x);
                if(!isNaN(x)){      //Not a Number
                   // console.log(x);
                stack.push(Number(x));   //숫자면 push
                }
                else{
                  let rt = stack.pop();        //숫자가 아니면 두 개 pop, 연산 수행 후 결과값은 다시 push
                  let lt = stack.pop(); 
                  
                  if(x==='+')stack.push(lt+rt);
                  else if(x==='-')stack.push(lt-rt);
                  else if(x==='*')stack.push(lt*rt);
                  else if(x==='/')stack.push(lt/rt);
                } 
            }
          //  console.log(stack);
            return answer  = stack.pop();
        }
    
        let str = "352+*9-";        //출력값 12
       // let str="35-7*62/+";      //출력값 -11
        console.log(solution(str));
    </script>
