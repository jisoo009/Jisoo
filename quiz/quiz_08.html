<html>
<head>
    <title>큐 - 미림왕국의 공주를 구하라</title>
</head>
<body>
    <script>
        function solution(n, k){
            let answer = 0;
            //방법 1
                // let queue = [];

                // //unshift, pop 사용
                // for(let i = 1; i < n; i++){
                //     queue.push(i);
                // }
                // console.log(queue);

                //방법 2
                let queue = Array.from({length:n}, (v,i) => i + 1);
               // console.log(queue);
               while(queue.length){
                for(let i = 1; i < k; i++)queue.push(queue.shift());
                    queue.shift();
                    if(queue.length === 1)answer = queue.shift;
               }
            return answer; 
        }
        console.log(solution(8,3));
    </script>
</body>
